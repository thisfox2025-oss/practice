<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css-intro/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/css-intro/user-card.css" />
    <title>User-Card</title>
  </head>
  <body>
    <article class="user-card">
      <div class="bg">
        <i class="fa-solid fa-pencil"></i>
      </div>
      <div class="content-wrapper">
        <img
          class="imgUser"
          src="./assets/images/pexels-ian-panelo-3049394.jpg"
          alt="Jane S. Doe"
        />
        <h2 class="userName">Jane S. Doe</h2>
        <div class="userGeoposition">Amsterdam , Netherlands</div>
        <div class="job">Copywriter</div>
        <p class="experience">
          Copywriter by day and photograher by nighits. I have 5+ yers of
          experience working with srartups big and small
        </p>
        <footer>
          <i class="userSocialLink fa-brands fa-square-twitter"></i>
          <i class="userSocialLink fa-brands fa-instagram"></i>
          <i class="userSocialLink fa-brands fa-facebook"></i>
        </footer>
      </div>
    </article>
  </body>
</html>
